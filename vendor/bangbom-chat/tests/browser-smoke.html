<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>방봄 브라우저 동작 확인</title><body><h1>브라우저 동작 확인</h1><p id="status">검사 중</p><pre id="report"></pre><div id="test"></div><script src="../dist/bangbom-chat.js"></script><script src="../src/catalog.js"></script><script>
const test=document.querySelector('#test'),report=document.querySelector('#report'),statusNode=document.querySelector('#status');let selected;const chat=BangbomChat.mount({catalog:BangbomChat.exampleCatalog,includeSamples:true,startOpen:true,embedded:true,container:test,onFloorplan:({id})=>{selected=id;}});const root=test.firstElementChild.shadowRoot;function check(bool,text){if(!bool)throw Error(text);report.textContent+='✓ '+text+'\n';}function click(label,context=root){let b=[...context.querySelectorAll('button')].find(b=>b.textContent===label&&!b.closest('[hidden]'));if(!b)throw Error('버튼 없음: '+label);b.click();}
try{chat.open('달서구 2억 5천 이하, 넓은 집');check(chat.getProfile().district===null,'제안 승인 전 상태 불변');click('이대로 반영');check(root.querySelectorAll('.card').length===3,'달서구 후보 3곳');check(root.querySelector('.card h3').textContent==='상인푸르지오 센터파크','면적 우선순위');click('앞의 두 곳 비교');check(root.querySelector('.sheet').textContent.includes('1,200만'),'보증금 차액');click('닫기',root.querySelector('.sheet'));click('평면도 보기');check(selected==='sangin-centerpark','단지 ID 전달');click('새 대화');click('대화 지우고 시작');click('수성구');click('2억 이하');click('보증금 낮은 순');check(root.querySelectorAll('.card').length===0,'잘못된 예산 후보 없음');click('상한을 3억 2,000만 원으로 변경');check(root.querySelectorAll('.card').length===1,'동의한 대안만 적용');click('조건 수정');root.querySelector('.sheet input[type=checkbox]').checked=false;click('이 조건으로 다시 찾기');check(root.querySelectorAll('.card').length===0,'예시 제외');click('새 대화');click('대화 지우고 시작');click('대구 전체');click('2억 5천 이하');check(root.querySelector('.log').textContent.includes('마음이 가세요'),'현재 후보의 실제 차이로 선호 질문');click('면적 넓은 순');chat.close();chat.open();check(!root.querySelector('.panel').hidden,'재열기');chat.destroy();check(!test.children.length,'해제');statusNode.textContent='PASS';}catch(e){statusNode.textContent='FAIL';report.textContent+=e.message;throw e;}
</script></body></html>
