</style></head><body><div class="wrap"><header class="mast"><div class="word"><span class="dot" aria-hidden="true">봄</span> 방봄</div><div class="meta"><i></i> 대구 전세 탐색 데모</div></header><main><section class="editorial"><div class="kicker">FIELD GUIDE &nbsp; / &nbsp; 01</div><h1>우리 집 기준,<br><em>말로 찾아요.</em></h1><p class="intro">보증금을 아낄지, 거실을 넓힐지. 마음에 걸리는 조건부터 말하면 비교해 볼 집이 남아요.</p><figure class="plan"><svg viewBox="0 0 390 115" aria-label="가구 배치를 표현한 장식용 평면 스케치" role="img"><defs><pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#d0d8c2" stroke-width=".7"/></pattern></defs><rect width="390" height="115" fill="url(#grid)"/><g fill="#f6f6e7" stroke="#41604a" stroke-width="3.5"><path d="M58 13H305V95H58Z"/><path d="M141 13v49H58m83 8v25m89-82v32h75m-74 13v37"/></g><g fill="#cad6b8" stroke="#55734f" stroke-width="1.5"><rect x="69" y="21" width="48" height="29" rx="2"/><path d="M78 21v29"/><rect x="152" y="20" width="48" height="15" rx="3"/><rect x="158" y="43" width="29" height="10" rx="4"/><rect x="239" y="64" width="52" height="22" rx="2"/><circle cx="271" cy="27" r="7"/></g><g stroke="#63815e" fill="none"><path d="M58 105h247m-247-3v6m247-6v6m11-95v82m-3-82h6m-6 82h6"/></g></svg><figcaption><b class="index">PLAN STUDY &nbsp; A—01</b><span>가구 배치 스케치 · 예시</span></figcaption></figure><div class="examples"><h2>한 문장으로 시작해 보기</h2><button data-prompt="달서구에서 전세 2억 5천 이하, 넓은 집이 좋아요"><b><span>01</span> 달서구에서 2억 5천 이하, 넓은 집</b> ↗</button><button data-prompt="대구 전체에서 보증금 2억 이하로 저렴한 곳"><b><span>02</span> 동네보다는 낮은 보증금이 먼저예요</b> ↗</button><button data-prompt="수성구, 2억 이하, 84㎡ 이상"><b><span>03</span> 희망 조건에 맞는 집이 없다면?</b> ↗</button></div></section><section class="stage" aria-label="챗봇 체험"><div class="label"><span>대화 미리보기</span><span>키 없이 작동 · 예시 포함</span></div><div id="chat"></div></section></main><footer class="foot"><strong>데모 데이터</strong> &nbsp; 방봄 홈에 표시된 공개 보도 단지 1곳과 시연용 예시 7곳입니다. 현재 공급 여부나 대출 자격을 나타내지 않습니다.</footer></div>
<dialog class="dest"><div class="label">SITE HANDOFF &nbsp; / &nbsp; 연결 미리보기</div><h2 id="d-title"></h2><p id="d-body"></p><p><code id="d-id"></code></p><a id="d-link" target="_blank" rel="noopener noreferrer"></a><button type="button" id="back">대화로 돌아가기</button></dialog>
<script>/*__BUNDLE__*/</script><script>/*__DATA__*/</script><script>
const D=document.querySelector('dialog');function destination(kind,item){const title=kind==='map'?'지도':kind==='house'?'평면도·3D':'기본정보';document.querySelector('#d-title').textContent=item.id?item.apartment.name+' · '+title:title;document.querySelector('#d-body').textContent=item.id?'선택한 단지 ID가 연결 함수에 전달됐어요. 아래 링크는 방봄의 공통 화면을 열며 이 데모 ID로 단지를 자동 선택하지 않아요.':'대출·지원 요건은 기존 기본정보 화면에서 확인해요.';document.querySelector('#d-id').textContent=item.id?'전달된 데모 ID: '+item.id:'';const a=document.querySelector('#d-link');a.href='https://bangkkumi2.vercel.app/#'+kind;a.textContent='방봄 '+title+' 열기 ↗';D.showModal();}document.querySelector('#back').onclick=()=>D.close();
const chat=BangbomChat.mount({container:document.querySelector('#chat'),embedded:true,startOpen:true,includeSamples:true,catalog:BangbomChat.exampleCatalog,onFloorplan:x=>destination('house',x),onMap:x=>destination('map',x),onProfile:x=>destination('input',x)});document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{chat.open(b.dataset.prompt);document.querySelector('.stage').scrollIntoView({block:'nearest'});});
</script></body></html>
